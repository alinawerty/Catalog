<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог игр</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/catalog.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Каталог игр</h1>
            <nav>
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог игр</a>
                <a href="item.html?id=1">Пример игры</a>
                <a href="add.html">Добавить игру</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section>
            <h2>Мои игры</h2>
            <div class="filters">
                <div>
                    <label for="search">Поиск по названию</label>
                    <input type="text" id="search" placeholder="Например, Hades">
                </div>
                <div>
                    <label for="genreFilter">Жанр</label>
                    <select id="genreFilter">
                        <option value="all">Все жанры</option>
                        <option value="RPG">RPG</option>
                        <option value="Action">Action</option>
                        <option value="Roguelike">Roguelike</option>
                        <option value="Приключение">Приключение</option>
                    </select>
                </div>
                <div>
                    <label for="statusFilter">Статус</label>
                    <select id="statusFilter">
                        <option value="all">Все статусы</option>
                        <option value="Пройдена">Пройдена</option>
                        <option value="В процессе">В процессе</option>
                        <option value="Заброшена">Заброшена</option>
                        <option value="В планах">В планах</option>
                    </select>
                </div>
            </div>
            <p id="resultCount" class="muted"></p>
            <div id="gameList" class="game-grid"></div>
        </section>
    </main>

    <footer><div class="container"><p>Учебный проект по HTML, CSS и JavaScript</p></div></footer>
</body>
</html>
